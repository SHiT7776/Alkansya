# Render Blueprint: one free web service + one free PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: alkansya-db
    plan: free
    databaseName: alkansya
    user: alkansya

services:
  - type: web
    name: alkansya
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: alkansya-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
