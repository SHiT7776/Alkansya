{% from "_macros.html" import logo with context %}
<header class="sticky top-0 z-40 border-b border-sand/70 bg-cream/85 backdrop-blur-md">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
    {{ logo(size='sm') }}
    <div class="flex items-center gap-2 sm:gap-3">
      <span class="inline-flex items-center gap-1.5 rounded-full border border-sand bg-white px-3 py-1.5 text-xs font-semibold tabular-nums text-muted" title="You'll be signed out automatically when idle">
        <i data-lucide="timer" class="h-3.5 w-3.5"></i><span data-idle-countdown>{{ '%d:%02d' % (idle_timeout // 60, idle_timeout % 60) }}</span>
      </span>
      {% if user.is_admin %}<span class="hidden rounded-full bg-clay-light px-3 py-1.5 text-xs font-bold uppercase tracking-wider text-clay-dark sm:inline">Admin</span>{% endif %}
      <div class="hidden text-right md:block">
        <p class="text-sm font-semibold leading-tight">{{ user.full_name }}</p>
        <p class="text-xs text-muted">@{{ user.username }}</p>
      </div>
      <a href="{{ url_for('logout') }}" class="inline-flex items-center gap-2 rounded-full bg-ink px-3.5 py-2 text-sm font-semibold text-cream transition hover:bg-forest-dark sm:px-4">
        <i data-lucide="log-out" class="h-4 w-4"></i><span class="hidden sm:inline">Sign out</span>
      </a>
    </div>
  </div>
</header>
