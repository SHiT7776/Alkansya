<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#1F4D3A">
  <title>{% block title %}{{ bank_name }} · {{ tagline }}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FBF6EE', sand: '#EFE6D8', ink: '#1E2A24', muted: '#6F685C',
            forest: { DEFAULT: '#1F4D3A', dark: '#163A2C', light: '#E3EEE7' },
            clay: { DEFAULT: '#C8693F', dark: '#A4522D', light: '#F7E4D7' },
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['Fraunces', 'Georgia', 'serif'],
          },
          boxShadow: {
            soft: '0 1px 2px rgba(30,42,36,.04), 0 12px 32px -16px rgba(30,42,36,.18)',
          },
        },
      },
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .btn-primary { @apply inline-flex items-center justify-center gap-2 rounded-2xl bg-forest px-5 py-3 text-sm font-semibold text-cream shadow-soft transition hover:bg-forest-dark active:scale-[.98] disabled:cursor-not-allowed disabled:opacity-70; }
      .btn-ghost { @apply inline-flex items-center justify-center gap-2 rounded-2xl border border-sand bg-white px-5 py-3 text-sm font-semibold text-ink transition hover:bg-cream active:scale-[.98]; }
      .btn-chip { @apply inline-flex items-center gap-1.5 rounded-full border border-sand bg-white px-3 py-1.5 text-xs font-semibold text-ink transition hover:border-forest/40 hover:bg-forest-light disabled:opacity-60; }
      .field { @apply w-full rounded-2xl border border-sand bg-cream/60 px-4 py-3 text-ink outline-none transition placeholder:text-muted/50 focus:border-forest focus:bg-white focus:ring-4 focus:ring-forest/10; }
      .label { @apply mb-1.5 block text-sm font-medium text-ink; }
      .panel { @apply rounded-[28px] border border-sand/80 bg-white p-5 shadow-soft sm:p-6; }
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-full bg-cream font-sans text-ink antialiased" data-idle="{{ idle_timeout }}">
  {% block body %}{% endblock %}

  <div id="toasts" class="pointer-events-none fixed inset-x-0 top-4 z-[60] flex flex-col items-center gap-2 px-4"></div>
  {% block flash_toasts %}
  <script>window.FLASHES = {{ get_flashed_messages(with_categories=true)|tojson }};</script>
  {% endblock %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
